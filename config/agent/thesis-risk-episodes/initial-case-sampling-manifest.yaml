locator_policy:
  root_reference: PRIVATE_DATA_ROOT
  committed_absolute_paths: false
  licensed_bytes_in_git: false
  resolution: >-
    Runtime resolves external manifests beneath the configured private data
    root. Digests and provider-neutral identities may be committed; local paths
    and licensed rows may not.

case_sampling:
  discovery_population: all eligible instrument and derived group sessions in the bounded universe
  hindsight_plane: full period through 2017-12-31 for interval construction and retrospective evidence review
  ex_ante_plane: available_at less than or equal to each replay time
  ranking_axes:
    - detector_consensus
    - standardized_signal_strength
    - persistence
    - cross_sectional_breadth
    - event_coverage
    - data_quality
  proof_corpus_targets:
    gold_cases: 3
    additional_silver_cases_minimum: 3
    additional_silver_cases_maximum: 6
    ordinary_or_negative_controls_minimum: 2
    incomplete_or_abstention_cases_minimum: 1
  morphology_requirements:
    - punctual_shock
    - slow_deterioration
    - group_or_sector_propagation
  direction_requirements:
    - downside
    - upside_or_two_sided
  control_requirements:
    - ordinary_period_without_material_manifestation
    - high_event_activity_with_low_market_materiality
    - ambiguous_or_incomplete_evidence
  selection_rule: >-
    Select cases only after the versioned detector sweep. Preserve the ranked
    candidate list, reasons for inclusion/exclusion, and all detector
    parameters. Do not select only famous events. Gold acceptance is performed
    by a reviewer independent of the evaluated architecture.

truth_boundaries:
  ravenpack: event_evidence_not_episode_ground_truth
  silver: programmatic_manifestation_label
  gold: governed_retrospective_case_not_causal_truth
  portfolio_relevance: derived_separately_per_portfolio
  population_recall_claim: prohibited
  synthetic_controls: explicitly_labelled_and_case_specific

known_limitations:
  - RavenPack coverage is portfolio-scoped rather than market-wide.
  - Two of eighteen portfolio securities are not linked to RavenPack.
  - Fixed 2026 portfolio quantities are counterfactual over 2013-2017.
  - All eighteen securities have some missing total-return observations in eligible history.
  - Eight securities have some missing valuation-price observations.
  - Sixteen securities have incomplete point-in-time fundamental availability.
  - The initial proof corpus cannot support a market-wide recall estimate.

next_session_gate:
  session_id: S02
  ready_when:
    - this manifest parses and its referenced external digests are present
    - B0/B1/A1 programme projection tests pass
    - user-facing data truth remains explicit
    - DetectorDefinition and AnomalySignal ownership remains risk_analytics
