schema_version: "1.0"
manifest_id: thesis-risk-episode-initial-case-sampling-v1
status: frozen_for_detector_development
created_at: "2026-08-14T00:00:00Z"
purpose: >-
  Bound the first real-data detector and case-design slice to the reviewed
  portfolio-linked universe that is already available point-in-time across the
  local research data plane. This is a software and methodology proof corpus,
  not a representative market-wide sample.

period:
  start: "2013-01-01"
  end: "2017-12-31"
  reason: exact common RavenPack coverage within the larger CRSP/Compustat history

universe:
  definition: >-
    Union of the 18 securities in the three human-reviewed
    thesis-real-portfolios-day4-v1 portfolios. CRSP/Compustat bindings use the
    corrected CCM snapshot. RavenPack is currently portfolio-scoped and links
    16 of the 18 securities; the two unmatched securities remain explicit
    data-quality and abstention opportunities.
  membership_source: thesis-real-portfolios-day4-v1
  expected_unique_securities: 18
  ravenpack_linked_securities: 16
  portfolios:
    - defensive_multi_asset
    - diversified
    - technology_concentrated
  portfolio_use: >-
    Fixed quantities are a disclosed counterfactual when replayed before their
    2026 selection date. Case discovery is instrument/group based; portfolio
    relevance is projected separately for each reviewed portfolio.
  exclusions:
    - securities without an exact date-effective CRSP identity
    - observations unavailable at the relevant point-in-time cutoff
    - ambiguous overlapping CCM links
    - fuzzy, ticker-only, or nearest-date matches

