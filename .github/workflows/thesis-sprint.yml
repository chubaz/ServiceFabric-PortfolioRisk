name: thesis-sprint

on:
  push:
    branches: [integration/thesis-experiment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked thesis environment
        run: python -m pip install --require-hashes -r requirements/thesis.lock
      - name: Verify synthetic Thesis Day 2 vertical slice
        run: make verify-thesis-day2
      - name: Verify network-free Day 3 fixture treatments
        run: make test-thesis-day3
      - name: Record synthetic-only CI boundary
        run: echo "CI runs schema-compatible synthetic fixtures only; verify-thesis-day2-real is a licensed local gate and is never invoked"
      - name: Write the external synthetic Day 1 demo
        run: THESIS_DATA_ROOT="${RUNNER_TEMP}/thesis-day1" make demo-thesis-day1
      - name: Validate whitespace
        run: git diff --check
