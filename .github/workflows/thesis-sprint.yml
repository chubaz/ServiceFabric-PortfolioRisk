name: thesis-sprint

on:
  push:
    branches: [integration/thesis-experiment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked thesis environment
        run: python -m pip install --require-hashes -r requirements/day1.lock
      - name: Verify current thesis lifecycle
        run: make verify-thesis-current
      - name: Validate whitespace
        run: git diff --check
